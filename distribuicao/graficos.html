<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none';"><title>Gráficos · Planejamento Financeiro</title><style>
 *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f5f9;color:#243247}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#14263d;color:white;padding:12px 18px}header strong{margin-right:auto;font-size:14px}header small{font-size:11px}header button{font:500 12px system-ui;min-height:36px;padding:8px 12px;border:1px solid #43536b;border-radius:8px;background:#243650;color:#f1f5fc;cursor:pointer}main{padding:18px;max-width:1600px;margin:auto}.analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.analysis-grid[hidden]{display:none}.analysis-grid>section{min-width:0;padding:20px;background:#fff;border:1px solid #e0e6ef;border-radius:12px}h2{font-size:15px;font-weight:650;margin:0 0 18px}.analysis-bars{display:grid;gap:14px}.analysis-row{display:grid;grid-template-columns:minmax(70px,110px) 1fr 100px;gap:10px;align-items:center;font-size:12px}.analysis-track{height:9px;background:#f1f3f8;border-radius:5px;overflow:hidden;display:block}.analysis-fill{display:block;height:100%;background:#5146cc;border-radius:5px}.analysis-amount{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.analysis-revenue .analysis-fill{background:#16734b}.analysis-expense .analysis-fill{background:#bd2b20}.analysis-rubric summary{cursor:pointer}.analysis-description-bars{margin:10px 0 0 12px}.analysis-description-row{margin-bottom:8px}body.dark-mode{background:#101a28;color:#dce4f0}body.dark-mode .analysis-grid>section{background:#1c293b;border-color:#344158}body.dark-mode .analysis-track{background:#2d3a50}body.dark-mode .analysis-revenue .analysis-fill{background:#6ee7b7}body.dark-mode .analysis-expense .analysis-fill{background:#fca5a5}@media(max-width:760px){.analysis-grid{grid-template-columns:minmax(0,1fr)}.analysis-row{grid-template-columns:minmax(60px,.8fr) 1fr auto}}

</style></head><body class="auth-pendente"><header><strong>Planejamento Financeiro · Gráficos</strong><small id="status" role="status">Arraste esta janela para o segundo monitor.</small><button id="join" type="button">Reunir colunas</button></header><main id="clean-month-analysis"><div class="analysis-grid" id="chart-grid" hidden><section class="analysis-revenue"><h2>Evolução das Receitas</h2><div id="clean-revenue-history-bars" class="analysis-bars"></div></section><section class="analysis-expense"><h2>Evolução das Despesas</h2><div id="clean-history-bars" class="analysis-bars"></div></section><section class="analysis-revenue"><h2>Receitas por Rubrica</h2><div id="clean-revenue-category-bars" class="analysis-bars"></div></section><section class="analysis-expense"><h2>Despesas por Rubrica</h2><div id="clean-category-bars" class="analysis-bars"></div></section></div></main><script id="pf-report-selection-module">/* Relatórios: modelos explícitos, duas apresentações e exportação sem código visível. */
(function () {
  'use strict';
  function financialModel(input) {
    input = input || {};
    const validDate = value => /^\d{4}-\d{2}-\d{2}$/.test(String(value || '')) && !Number.isNaN(Date.parse(value + 'T12:00:00Z')) && new Date(value + 'T12:00:00Z').toISOString().slice(0,10) === value;
    const day = (value, n) => { const d = new Date(value + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const now = new Date(), today = input.today || now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    const rows = Array.isArray(input.rows) ? input.rows.map(t => ({ ...t })) : null;
    const base = Array.isArray(input.base) ? input.base.map(t => ({ ...t })) : rows || [];
    const dates = (rows || []).map(t => t.vencimento).filter(validDate).sort();
    const start = input.start || dates[0] || today, end = input.end || dates.at(-1) || today;
    if (!validDate(today) || !validDate(start) || !validDate(end) || start > end) throw Error('Período inválido para o relatório.');
    const cents = t => { const n = Number(t.valor); if (!Number.isFinite(n)) throw Error('Valor inválido no relatório.'); return Math.round(n * 100); };
    const paid = t => !!t.dataPg || ['Pago', 'Paga', 'Recebido', 'Recebida', 'Liquidado', 'Liquidada', 'feito'].includes(t.status);
    const incoming = t => t.tipo === 'Receita';
    const signed = t => incoming(t) ? cents(t) : -cents(t);
    const sum = (a, f = cents) => a.reduce((n, t) => n + f(t), 0);
    const active = (rows || []).filter(t => ['Receita', 'Despesa', 'Investimentos'].includes(t.tipo));
    const rec = active.filter(incoming), exp = active.filter(t => t.tipo === 'Despesa'), inv = active.filter(t => t.tipo === 'Investimentos');
    const overdue = t => !paid(t) && validDate(t.vencimento) && t.vencimento < today;
    const future = t => !paid(t) && validDate(t.vencimento) && t.vencimento >= today;
    const endHorizon = day(today, 29);
    const upcoming = base.filter(t => ['Receita', 'Despesa', 'Investimentos'].includes(t.tipo) && future(t) && t.vencimento <= endHorizon).sort((a, b) => a.vencimento.localeCompare(b.vencimento) || String(a.descricao).localeCompare(String(b.descricao)));
    const historic = base.filter(t => overdue(t) && t.vencimento < start);
    const available = rows !== null && input.balanceAvailable === true;
    let opening = null, closing = null, current = null, minimum = null, minimumScheduled = null, projection = [], daily = [];
    if (available) {
      opening = sum(base.filter(t => validDate(t.vencimento) && t.vencimento < start), signed);
      let acc = opening;
      const length = Math.round((Date.parse(end + 'T12:00:00Z') - Date.parse(start + 'T12:00:00Z')) / 86400000);
      if (length > 3660) throw Error('Período muito extenso para a trajetória diária.');
      const groups = new Map();
      for (const t of active) if (validDate(t.vencimento) && t.vencimento >= start && t.vencimento <= end) groups.set(t.vencimento, (groups.get(t.vencimento) || 0) + signed(t));
      for (let i = 0; i <= length; i++) { const date = day(start, i); acc += groups.get(date) || 0; daily.push({ date, balance: acc }); }
      closing = acc;
      minimumScheduled = daily.reduce((a, p) => !a || p.balance < a.balance ? p : a, null);
      current = sum(base.filter(t => paid(t) && validDate(t.dataPg || t.vencimento) && (t.dataPg || t.vencimento) <= today), signed);
      let projected = current;
      for (let i = 0; i < 30; i++) { const date = day(today, i); projected += sum(upcoming.filter(t => t.vencimento === date), signed); projection.push({ date, balance: projected }); }
      minimum = projection.reduce((a, p) => !a || p.balance < a.balance ? p : a, null);
    }
    const stats = rows === null ? null : {
      revenue: sum(rec), received: sum(rec.filter(paid)), receivable: sum(rec.filter(t => !paid(t))),
      receivableOnTime: sum(rec.filter(future)), overdueReceivable: sum(rec.filter(overdue)),
      expense: sum(exp), paidExpense: sum(exp.filter(paid)), due: sum(exp.filter(future)), overdueExpense: sum(exp.filter(overdue)),
      investment: sum(inv), result: sum(rec) - sum(exp) - sum(inv),
      pastReceivable: sum(historic.filter(incoming)), pastPayable: sum(historic.filter(t => !incoming(t)))
    };
    const clean = t => ({ id: t.id, descricao: String(t.descricao || 'Sem descrição'), vencimento: String(t.vencimento || ''), valor: cents(t), tipo: t.tipo });
    const payments = upcoming.filter(t => !incoming(t)), receipts = upcoming.filter(incoming);
    const groupUpcoming = a => [...a.reduce((m, t) => { const g = m.get(t.vencimento) || { date: t.vencimento, count: 0, total: 0, names: [] }; g.count++; g.total += cents(t); g.names.push(String(t.descricao || 'Sem descrição')); m.set(t.vencimento, g); return m; }, new Map()).values()];
    return {
      title: String(input.title || 'Relatório financeiro'), kind: String(input.kind || 'gerencial'), start, end, today,
      issued: String(input.issued || new Date().toLocaleString('pt-BR')), filters: String(input.filters || 'Filtros da exportação atual'), scopeNote: String(input.scopeNote || ''), demo: !!input.demo,
      available: rows !== null, balanceAvailable: available, stats, opening, closing, current, minimum, minimumScheduled, daily, projection,
      payments: groupUpcoming(payments).slice(0, 6), morePayments: Math.max(0, groupUpcoming(payments).length - 6),
      receipts: groupUpcoming(receipts).slice(0, 4), moreReceipts: Math.max(0, groupUpcoming(receipts).length - 4),
      top: exp.slice().sort((a, b) => cents(b) - cents(a) || String(a.descricao).localeCompare(String(b.descricao))).slice(0, 5).map(clean), count: active.length,
      undated: active.filter(t => !validDate(t.vencimento)).length,
      futureLabel: today + ' a ' + endHorizon
    };
  }

  function summaryHTML(m) {
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const br = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s.split('-').reverse().join('/') : 'N/D';
    const money = n => n === null || n === undefined ? 'N/D' : (n / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const s = m.stats;
    const section = (key, html) => '<section data-summary="' + key + '">' + html + '</section>';
    const metric = (label, value, cls) => '<div class="pf-s-metric ' + (cls || '') + '"><span>' + esc(label) + '</span><strong>' + esc(money(value)) + '</strong></div>';
    let html = '<article class="pf-summary-page"><header class="pf-s-header"><span class="pf-s-eyebrow">RELATÓRIO RESUMIDO</span><h1>' + esc(m.title) + '</h1><p>' + br(m.start) + ' a ' + br(m.end) + ' · Emissão: ' + esc(m.issued) + '</p><p>Referência: ' + br(m.today) + ' · Critério do período: vencimento</p><p><b>Filtros:</b> ' + esc(m.filters) + '</p>' + (m.scopeNote ? '<p>' + esc(m.scopeNote) + '</p>' : '') + '</header>';
    html += section('indicators', '<h2>Visão geral do período</h2>' + (s ? '<div class="pf-s-metrics">' + metric('Receitas previstas', s.revenue) + metric('Receitas recebidas', s.received, 'positive') + metric('A receber — total em aberto', s.receivable) + metric('Despesas pagas', s.paidExpense) + metric('Despesas a vencer', s.due, 'warning') + metric('Despesas vencidas no período', s.overdueExpense, 'negative') + metric('Despesas totais', s.expense) + metric('Investimentos', s.investment) + metric('Resultado previsto', s.result, 'featured') + '</div><p class="pf-s-note">Resultado = receitas − despesas − investimentos. Estimativa por vencimento; não representa saldo bancário conciliado.</p>' : '<p>Esta exportação não forneceu lançamentos estruturados. Consulte os valores no modo completo; totais não foram inferidos da imagem do gráfico.</p>'));
    html += section('balances', '<h2>Saldos e bases de cálculo</h2>' + (m.balanceAvailable ? '<div class="pf-s-balance"><p><b>Por vencimento, no período:</b> abertura ' + money(m.opening) + ' · final ' + money(m.closing) + '.</p><p>Menor saldo por vencimento: <b>' + money(m.minimumScheduled?.balance) + '</b> em ' + br(m.minimumScheduled?.date) + '.</p><p><b>Próximos 30 dias, a partir do realizado:</b> menor saldo <b>' + money(m.minimum?.balance) + '</b> em ' + br(m.minimum?.date) + '.</p></div><p class="pf-s-note">Bases diferentes, não conciliadas com extrato. A projeção parte dos movimentos liquidados cadastrados até a referência e acrescenta os compromissos em aberto dos próximos 30 dias. Atrasados não são recebimentos presumidos.</p>' : '<p class="pf-s-note">Saldos inicial, final e trajetória: N/D. Este recorte de conteúdo não determina o caixa disponível. Os totais acima se referem somente aos filtros informados.</p>'));
    function upcoming(title, a, extra) {
      return '<h2>' + title + '</h2><p class="pf-s-note">Janela: ' + br(m.today) + ' a ' + br(m.futureLabel.split(' a ')[1]) + '; filtros de conteúdo mantidos.</p>' + (a.length ? '<table><thead><tr><th>Vencimento</th><th>Compromisso</th><th class="num">Valor</th></tr></thead><tbody>' + a.map(g => '<tr><td>' + br(g.date) + '</td><td>' + esc(g.count === 1 ? g.names[0] : g.count + ' lançamentos na data') + '</td><td class="num">' + money(g.total) + '</td></tr>').join('') + '</tbody></table>' : '<p class="pf-s-note">Nenhum compromisso cadastrado nessa janela.</p>') + (extra ? '<p class="pf-s-note">Mais ' + extra + ' data(s) de vencimento: consulte o modo completo.</p>' : '');
    }
    html += '<div class="pf-s-schedule">' + section('payments', upcoming('Próximas contas a pagar', m.payments, m.morePayments));
    html += section('receipts', upcoming('Recebimentos previstos', m.receipts, m.moreReceipts)) + '</div>';
    const alerts = [];
    if (s?.overdueReceivable) alerts.push('Receitas vencidas no período: ' + money(s.overdueReceivable) + '.');
    if (s?.pastReceivable) alerts.push('Receitas atrasadas de períodos anteriores: ' + money(s.pastReceivable) + '.');
    if (s?.pastPayable) alerts.push('Saídas atrasadas de períodos anteriores: ' + money(s.pastPayable) + '.');
    if (m.minimum && m.minimum.balance < 0) alerts.push('Déficit projetado, pela base realizada cadastrada: ' + money(-m.minimum.balance) + ' em ' + br(m.minimum.date) + '. Confirmar disponibilidade e recebimentos.');
    if (m.receipts.length === 1 && m.receipts[0].count > 1) alerts.push('Os próximos recebimentos cadastrados estão concentrados em ' + br(m.receipts[0].date) + '.');
    if (m.undated) alerts.push(m.undated + ' lançamento(s) sem vencimento válido; não incluídos nas trajetórias diárias.');
    html += section('alerts', '<h2>Alertas</h2>' + (alerts.length ? '<ul>' + alerts.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '<p class="pf-s-note">Nenhum alerta adicional identificado nos dados fornecidos.</p>')) + '</article>';

    function stackChart() {
      if (!s) return '<p>N/D — lançamentos não fornecidos.</p>';
      const series = [[s.received, s.receivableOnTime, s.overdueReceivable], [s.paidExpense, s.due, s.overdueExpense]];
      const lo = Math.min(0, ...series.map(v => v.filter(n => n < 0).reduce((a, n) => a + n, 0))), hi = Math.max(1, ...series.map(v => v.filter(n => n >= 0).reduce((a, n) => a + n, 0)));
      const x = n => 75 + (n - lo) / (hi - lo) * 285, colors = ['#166534', '#92400e', '#b91c1c'];
      let out = '<svg viewBox="0 0 390 150" role="img" aria-label="Receitas e despesas: liquidado, em aberto no prazo e vencido. Valores detalhados na tabela acessível."><line x1="' + x(0) + '" y1="15" x2="' + x(0) + '" y2="120" stroke="#64748b"/>';
      series.forEach((parts, i) => { let pos = 0, neg = 0; out += '<text x="0" y="' + (43 + i * 57) + '" font-size="12">' + ['Receitas', 'Despesas'][i] + '</text>'; parts.forEach((v, k) => { const start = v >= 0 ? pos : neg; if (v >= 0) pos += v; else neg += v; out += '<rect x="' + Math.min(x(start), x(start + v)) + '" y="' + (23 + i * 57) + '" width="' + Math.abs(x(start + v) - x(start)) + '" height="25" fill="' + colors[k] + '"><title>' + esc(money(v)) + '</title></rect>'; }); out += '<text x="75" y="' + (64 + i * 57) + '" font-size="12">Total: ' + esc(money(parts.reduce((a, v) => a + v, 0))) + '</text>'; });
      return out + '</svg><p class="pf-s-legend">Verde: liquidado · Âmbar: em aberto no prazo · Vermelho: vencido</p><details class="pf-s-accessible"><summary>Tabela dos dados do gráfico</summary><table><thead><tr><th>Tipo</th><th>Liquidado</th><th>No prazo</th><th>Vencido</th></tr></thead><tbody>' + series.map((a, i) => '<tr><td>' + ['Receitas', 'Despesas'][i] + '</td>' + a.map(v => '<td>' + money(v) + '</td>').join('') + '</tr>').join('') + '</tbody></table></details>';
    }
    function trajectory() {
      if (!m.balanceAvailable || !m.projection.length) return '<p class="pf-s-note">N/D — o recorte não permite calcular disponibilidade de caixa.</p>';
      const points = m.projection, min = Math.min(0, ...points.map(p => p.balance)), max = Math.max(0, ...points.map(p => p.balance)), span = max - min || 1;
      const x = i => 65 + i / Math.max(1, points.length - 1) * 285, y = n => 125 - (n - min) / span * 100;
      const pointsHTML = points.map((p, i) => x(i) + ',' + y(p.balance)).join(' ');
      return '<svg viewBox="0 0 390 165" role="img" aria-label="Projeção de saldo a partir do realizado cadastrado. Menor saldo ' + esc(money(m.minimum.balance)) + ' em ' + br(m.minimum.date) + '"><text x="1" y="20" font-size="11">' + esc(money(max)) + '</text><text x="1" y="132" font-size="11">' + esc(money(min)) + '</text><line x1="65" y1="' + y(0) + '" x2="350" y2="' + y(0) + '" stroke="#94a3b8" stroke-dasharray="4 4"/><polyline points="' + pointsHTML + '" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="65" y="155" font-size="11">' + br(points[0].date) + '</text><text x="350" y="155" text-anchor="end" font-size="11">' + br(points.at(-1).date) + '</text></svg><p class="pf-s-note">Base realizada; mínimo ' + money(m.minimum.balance) + ' em ' + br(m.minimum.date) + '. Não conciliado.</p>';
    }

   if(payload.model)safe.model={...payload.model,rows:api.data.rows(payload.model.rows),future:api.data.rows(payload.model.future),paid:undefined,overdue:undefined,allOverdue:undefined,largest:undefined};
   const script=report.createElement('script');script.id='pf-chart-explorer-runtime';
   script.textContent='window.PFChartExplorer=('+boot.toString()+')('+chartData.toString()+','+JSON.stringify(safe).replace(/</g,()=>String.fromCharCode(92)+'u003c').replace(/\u2028/g,()=>String.fromCharCode(92)+'u2028').replace(/\u2029/g,()=>String.fromCharCode(92)+'u2029')+');';report.body.append(script);
  }

</script><script>function monthAnalysisData(rows,allRows,chosen){
/* PFQF bridge:start */
 if(typeof window!=='undefined'&&window.PFQuickCards)allRows=window.PFQuickCards.apply(allRows);
/* PFQF bridge:end */

 const date=new Date(Number(chosen.slice(0,4)),Number(chosen.slice(5,7))-1,1);
 const categories=type=>{const sums=new Map();for(const row of rows){if(row.tipo!==type)continue;const name=String(row.categoria||'Sem rubrica');sums.set(name,(sums.get(name)||0)+Number(row.valor||0));}return [...sums].sort((a,b)=>b[1]-a[1]);};
 const months=Array.from({length:6},(_,i)=>{const d=new Date(date.getFullYear(),date.getMonth()-5+i,1);return {key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})};});
 const history=type=>months.map(month=>[month.label,allRows.filter(row=>row.tipo===type&&String(row.vencimento).startsWith(month.key)).reduce((sum,row)=>sum+Number(row.valor||0),0)]);
 const descriptions=type=>{
  const groups=new Map();
  for(const row of rows){
   if(row.tipo!==type)continue;
   const category=String(row.categoria||'Sem rubrica'),description=String(row.descricao||'').trim()||'Sem descrição';
   if(!groups.has(category))groups.set(category,new Map());
   const items=groups.get(category);
   items.set(description,(items.get(description)||0)+Number(row.valor||0));
  }
  return groups;
 };
 return {revenueCategories:categories('Receita'),expenseCategories:categories('Despesa'),revenueHistory:history('Receita'),expenseHistory:history('Despesa'),revenueDescriptions:descriptions('Receita'),expenseDescriptions:descriptions('Despesa')};
}
function categoryBreakdownBars(entries,descriptions,format,escape,expanded=new Set()){
 const max=Math.max(1,...entries.map(x=>x[1]));
 const row=(name,value,summary=false)=>'<'+(summary?'summary':'div')+' class="analysis-row '+(summary?'analysis-rubric-summary':'analysis-description-row')+'"><span>'+escape(name)+'</span><span class="analysis-track"><span class="analysis-fill" style="width:'+Math.max(0,value/max*100)+'%"></span></span><span class="analysis-amount">'+escape(format(value))+'</span></'+(summary?'summary':'div')+'>';
 return entries.map(([category,total])=>{
  const items=[...(descriptions.get(category)||[])].sort((a,b)=>b[1]-a[1]);
  return '<details class="analysis-rubric" data-rubric="'+escape(category)+'"'+(expanded.has(category)?' open':'')+'>'+row(category,total,true)+'<div class="analysis-description-bars">'+items.map(([name,value])=>row(name,value)).join('')+'</div></details>';
 }).join('');
}

 const $=id=>document.getElementById(id),channel=new URLSearchParams(location.search).get('canal');
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 function render(state){
  const hidden=!!state.locked;document.body.classList.toggle('auth-pendente',hidden);document.body.classList.toggle('dark-mode',!!state.dark);
  if(state.font)document.body.style.fontFamily=state.font;
  const rows=hidden?[]:PFChartExplorer.data.rows(state.rows),allRows=hidden?[]:PFChartExplorer.data.rows(state.allRows),chosen=/^\d{4}-\d{2}-\d{2}$/.test(state.chosen||'')?state.chosen:new Date().toISOString().slice(0,10);
  const data=monthAnalysisData(rows,allRows,chosen);
  const bars=entries=>{const max=Math.max(1,...entries.map(x=>x[1]));return entries.map(([name,value])=>'<div class="analysis-row"><span>'+escape(name)+'</span><span class="analysis-track"><span class="analysis-fill" style="width:'+Math.max(0,value/max*100)+'%"></span></span><span class="analysis-amount">'+escape(money(value))+'</span></div>').join('')};
  $('clean-revenue-history-bars').innerHTML=hidden?'':bars(data.revenueHistory);
  $('clean-history-bars').innerHTML=hidden?'':bars(data.expenseHistory);
  $('clean-revenue-category-bars').innerHTML=hidden?'':categoryBreakdownBars(data.revenueCategories,data.revenueDescriptions,money,escape)||'<p>Sem receitas para os filtros selecionados.</p>';
  $('clean-category-bars').innerHTML=hidden?'':categoryBreakdownBars(data.expenseCategories,data.expenseDescriptions,money,escape)||'<p>Sem despesas para os filtros selecionados.</p>';
  PFChartExplorer.capture('monthly',{rows,allRows,chosen});
  $('status').textContent=hidden?'Valores protegidos na janela principal.':'Sincronizado com os dados e filtros da janela principal.';
  $('chart-grid').hidden=hidden;
 }
 const empty=()=>render({locked:true,rows:[],allRows:[]});
 $('join').onclick=()=>{if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'pf-chart-join',channel},location.origin==='null'?'*':location.origin);else window.close()};
 window.addEventListener('message',event=>{if(event.source!==window.opener||event.origin!==location.origin||event.data?.channel!==channel||event.data?.type!=='pf-chart-state')return;const state=event.data.state;if(!state||!Array.isArray(state.rows)||!Array.isArray(state.allRows))return;render(state)});
 window.addEventListener('load',()=>{if(channel&&window.opener&&!window.opener.closed)window.opener.postMessage({type:'pf-chart-ready',channel},location.origin==='null'?'*':location.origin)});
 setInterval(()=>{if(!window.opener||window.opener.closed){empty();$('status').textContent='Janela principal fechada. Reabra os gráficos pelo aplicativo.'}},700);
 </script>






<script id="pf-global-language">
/* Chart windows receive only the display language from their existing opener. */
(()=>{
 'use strict';
 let language='pt-BR',observer,scheduled=false;
 const records=new WeakMap(),attributeRecords=new WeakMap();
 const parentApi=()=>{try{return window.opener&&!window.opener.closed?window.opener.PFI18n:null;}catch(_){return null;}};
 const originalText=node=>{if(!node)return '';if(node.nodeType===3){const saved=records.get(node);return saved&&node.data===saved.last?saved.source:node.data;}return [...(node.childNodes||[])].map(originalText).join('');};

 const translate=value=>parentApi()?.translate(value,language)||value;
 const skip=element=>!element||!!element.closest('script,style,.analysis-bars,.pfce-alt,.pfce-bars,.pfce-detail tbody,.pfce-points,svg text,tbody,input,textarea');
 function observe(){observer.observe(document.body,{subtree:true,childList:true,characterData:true});}
 function apply(){scheduled=false;observer?.disconnect();let changed=false;try{const previousLanguage=language;language=parentApi()?.getLanguage()||'pt-BR';changed=language!==previousLanguage;document.documentElement.lang=language;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){const parent=node.parentElement;if(skip(parent)||!node.data.trim())continue;const previous=records.get(node),source=previous&&node.data===previous.last?previous.source:parentApi()?.canonical(node.data)||node.data;if(parent.tagName==='OPTION'&&!parent.hasAttribute('value'))parent.setAttribute('value',parent.value);const next=translate(source);if(node.data!==next){parent.dataset.pfceUi='true';node.data=next;}records.set(node,{source,last:next});}for(const element of document.querySelectorAll('[title],[aria-label]')){if(skip(element))continue;let saved=attributeRecords.get(element);if(!saved){saved={};attributeRecords.set(element,saved);}for(const name of ['title','aria-label']){const value=element.getAttribute(name);if(!value)continue;const previous=saved[name],source=previous&&value===previous.last?previous.source:value,next=translate(source);if(value!==next)element.setAttribute(name,next);saved[name]={source,last:next};}}}finally{observe();}if(changed)window.PFChartExplorer?.refresh?.();}
 function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(apply);}
 function install(){observer=new MutationObserver(schedule);apply();try{if(window.opener){window.opener.addEventListener('pf-language-change',schedule);window.addEventListener('pagehide',()=>{try{window.opener.removeEventListener('pf-language-change',schedule);}catch(_){}},{once:true});}}catch(_){} }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})();

</script>
